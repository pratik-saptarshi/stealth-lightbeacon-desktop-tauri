name: Test Smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.12.4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.13.1
          cache: pnpm

      - name: Verify Node runtime policy
        env:
          GATE_REQUIRE_RUNTIME: "1"
        run: bash scripts/evals/node-version-gate.sh

      - name: Verify Node gate self-test
        run: pnpm run eval:node-version:test

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fast lint (oxlint)
        run: pnpm run lint:fast

      - name: Shell unit/integration smoke
        run: pnpm run test -- src/__tests__/app-shell.test.tsx src/lib/desktop.test.ts src/__tests__/app-helpers.test.ts

      - name: Playwright navigation and reports smoke
        run: pnpm run test:e2e --grep "keeps inactive panels hidden behind horizontal tabs|shows reports tab trace and report-download table"
